name: CI

on:
  push:
    branches:
      - main
      - QueueManager.v2
      - QueueManager.v3
      - rework
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install locked dependencies
      run: uv sync --locked
    - name: Run backend tests
      run: uv run pytest -q
    - name: Build backend package
      run: uv build

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install locked dependencies
      run: npm --prefix frontend ci
    - name: Run frontend tests
      run: npm --prefix frontend test
    - name: Typecheck frontend
      run: npm --prefix frontend run typecheck
    - name: Build frontend
      run: npm --prefix frontend run build
    - name: Set up uv for frontend integration
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Set up Python for frontend integration
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install backend dependencies for frontend integration
      run: uv sync --locked
    - name: Run production frontend integration
      run: uv run pytest -q ci_tests/test_frontend_integration.py
